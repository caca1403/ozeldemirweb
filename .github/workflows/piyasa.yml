name: Piyasa verisi guncelle
on:
  schedule:
    - cron: '0 3 * * *'  # her gun 06:00 Turkiye saati
  workflow_dispatch:
permissions:
  contents: write
jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/piyasa.py
      - name: Degisiklik varsa yayinla
        run: |
          if ! git diff --quiet assets/piyasa.json; then
            git config user.name "piyasa-robotu"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/piyasa.json
            git commit -m "Piyasa verisi guncellendi ($(date +%F))"
            git push https://x-access-token:${{ secrets.PIYASA_TOKEN || github.token }}@github.com/${{ github.repository }} HEAD:refs/heads/main
          else
            echo "Veri degismedi, yayin yok."
          fi
